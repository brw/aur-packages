name: ci

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - '*/PKGBUILD'
  workflow_dispatch:
    inputs:
      package:
        description: "Package directory to build and publish"
        required: true

permissions:
  contents: read

jobs:
  find-packages:
    name: Find updated packages
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.find-packages.outputs.packages }}
      changed: ${{ steps.find-packages.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Find updated packages
        id: find-packages
        env:
          PACKAGE: ${{ inputs.package }}
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.before }}
        run: |
          #!/usr/bin/env bash
          set -euxo pipefail

          if [ -n "$PACKAGE" ]; then
            echo "packages=$(printf '%s' "$PACKAGE" | jq -Rnc '[inputs]')" >> "$GITHUB_OUTPUT"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          elif [ -n "$BASE_REF" ]; then
            revs=("origin/${BASE_REF}...HEAD")
          elif [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            revs=("$BASE_SHA" HEAD)
          else
            echo "::error::no previous state to determine the changed packages from"
            exit 1
          fi

          packages=()
          while IFS= read -r -d '' file; do
            dir=${file%/*}
            # process AUR package names only
            [[ $dir =~ ^[a-zA-Z0-9@._+-]+$ ]] || continue
            packages+=("$dir")
          done < <(git diff --name-only -z "${revs[@]}" -- "*PKGBUILD" "*/.SRCINFO")

          if ((${#packages[@]} == 0)); then
            echo "packages=[]" >> "$GITHUB_OUTPUT"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "packages=$(printf '%s\n' "${packages[@]}" | sort -u | jq -Rnc '[inputs]')" >> "$GITHUB_OUTPUT"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  metadata:
    name: Regenerate metadata (${{ matrix.package }})
    runs-on: ubuntu-latest
    needs: find-packages
    # only for same-repo prs (we can commit to it).
    # main and fork prs validate the tree as-is instead
    if: >-
      !failure()
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && needs.find-packages.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.find-packages.outputs.packages) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Regenerate checksums and .SRCINFO
        uses: ./.github/actions/pkgbuild
        with:
          pkgname: ${{ matrix.package }}
          image: docker.io/library/archlinux:base-devel
          update_metadata: true
          build: false
          base_sha: ${{ github.event.pull_request.base.sha }}

      - name: Upload regenerated metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.package }}
          path: ${{ matrix.package }}
          include-hidden-files: true
          if-no-files-found: error

  validate:
    name: ${{ matrix.package }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs:
      - find-packages
      - metadata
    # do not change to success(). `metadata` gets skipped for main pushes and fork prs
    if: >-
      !failure()
      && needs.find-packages.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.find-packages.outputs.packages) }}
        arch:
          - x86_64
          - aarch64
        include:
          - arch: x86_64
            runner: ubuntu-latest
            image: docker.io/library/archlinux:base-devel

          - arch: aarch64
            runner: ubuntu-24.04-arm
            image: docker.io/menci/archlinuxarm:base-devel

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download regenerated metadata
        if: needs.metadata.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.package }}
          path: ${{ matrix.package }}

      - name: Build and validate
        uses: ./.github/actions/pkgbuild
        with:
          pkgname: ${{ matrix.package }}
          image: ${{ matrix.image }}

  publish:
    name: Publish (${{ matrix.package }})
    runs-on: ubuntu-latest
    needs:
      - find-packages
      - validate
    if: >-
      !failure()
      && github.event_name != 'pull_request'
      && needs.find-packages.outputs.changed == 'true'
    concurrency:
      group: publish-${{ matrix.package }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.find-packages.outputs.packages) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Publish package
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: ${{ matrix.package }}
          pkgbuild: ${{ matrix.package }}/PKGBUILD
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}

  commit:
    name: Commit regenerated metadata
    runs-on: ubuntu-latest
    needs: validate
    if: >-
      !failure()
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    concurrency:
      group: commit-metadata-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Download regenerated metadata
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2

      - name: Commit regenerated metadata
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          branch: ${{ github.head_ref }}
          file_pattern: '*/PKGBUILD */.SRCINFO'

  required:
    name: required
    runs-on: ubuntu-latest
    needs:
      - find-packages
      - metadata
      - validate
      - publish
      - commit
    if: always()
    steps:
      - name: Fail if any job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
