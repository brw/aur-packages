name: updpkgsums

on:
  pull_request:
    types:
      - opened
      - synchronize
    branches:
      - main

jobs:
  updpkgsums:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Find updated package
        id: find-package
        run: |
          #!/usr/bin/env bash
          set -euxo pipefail

          echo "PKGBUILD=$(git diff --name-only origin/main origin/${GITHUB_HEAD_REF} "*PKGBUILD" | head -1 | xargs dirname)" >> $GITHUB_OUTPUT

      - name: Validate package
        if: ${{ steps.find-package.outputs.PKGBUILD != '' }}
        uses: ./.github/actions/aur
        with:
          pkgname: ${{ steps.find-package.outputs.PKGBUILD }}

      - name: Commit
        if: ${{ steps.find-package.outputs.PKGBUILD != '' }}
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          file_pattern: '*/PKGBUILD */.SRCINFO'
