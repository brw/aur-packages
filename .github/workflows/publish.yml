name: publish

on:
  push:
    branches:
      - main
    paths:
      - '*/PKGBUILD'

jobs:
  find-packages:
    name: Find updated packages
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.find-packages.outputs.packages }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Find updated packages
        id: find-packages
        run: |
          #!/usr/bin/env bash
          set -euxo pipefail

          echo "packages=$(git diff --name-only HEAD HEAD~1 "*/.SRCINFO" | xargs dirname | jq -Rnc '[inputs]')" >> $GITHUB_OUTPUT

  publish:
    name: Publish package
    runs-on: ubuntu-latest
    needs: find-packages
    strategy:
      matrix:
        package: ${{ fromJSON(needs.find-packages.outputs.packages) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Publish package
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: ${{ matrix.package }}
          pkgbuild: ${{ matrix.package }}/PKGBUILD
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
