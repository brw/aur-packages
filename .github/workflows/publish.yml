name: publish

on:
  push:
    branches:
      - main
    paths:
      - '*/PKGBUILD'

jobs:
  find-packages:
    name: Find updated packages
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.find-packages.outputs.packages }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Find updated packages
        id: find-packages
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          #!/usr/bin/env bash
          set -euxo pipefail

          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "::error::no previous state for this branch, so the changed packages cannot be determined"
            exit 1
          fi

          changed=$(git diff --name-only "$BASE_SHA" HEAD -- "*PKGBUILD" "*/.SRCINFO" | xargs -r dirname | sort -u)
          echo "packages=$(echo "$changed" | jq -Rnc '[inputs]')" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish package
    runs-on: ubuntu-latest
    needs: find-packages
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.find-packages.outputs.packages) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Build, validate and regenerate .SRCINFO
        uses: ./.github/actions/pkgbuild
        with:
          pkgname: ${{ matrix.package }}
          image: docker.io/library/archlinux:base-devel
          update_metadata: true
          base_sha: ${{ github.event.before }}

      - name: Upload regenerated .SRCINFO
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.package }}
          path: ${{ matrix.package }}
          include-hidden-files: true
          if-no-files-found: error

      - name: Publish package
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: ${{ matrix.package }}
          pkgbuild: ${{ matrix.package }}/PKGBUILD
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}

  commit:
    name: Commit regenerated .SRCINFO
    runs-on: ubuntu-latest
    needs: publish
    concurrency:
      group: commit-metadata-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Download regenerated .SRCINFO
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1

      - name: Commit regenerated .SRCINFO
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          branch: ${{ github.ref_name }}
          file_pattern: '*/PKGBUILD */.SRCINFO'
